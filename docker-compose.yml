services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - nginx-proxy-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-youtube_randomizer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-youtube_randomizer}
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-youtube_randomizer} -d ${POSTGRES_DB:-youtube_randomizer}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - nginx-proxy-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    networks:
      - nginx-proxy-network
    environment:
      REDIS_URL: redis://redis:6379
      # Auth.js/NextAuth in production builds requires explicit host trust when self-hosting.
      AUTH_TRUST_HOST: "true"
      # Auth.js prefers AUTH_URL (NEXTAUTH_URL is legacy); keep them aligned.
      AUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:

networks:
  nginx-proxy-network:
    external: true